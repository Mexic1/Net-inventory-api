[project]
name = "net-inventory-api"
version = "0.1.0"
description = "REST API over a network device inventory, exporting Nornir hosts.yaml"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is imported as a top-level package from the repo root.
pythonpath = ["."]
