name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # Overrides the 5433 default in tests/conftest.py: the service container
      # above publishes on 5432, and nothing else is competing for it here.
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the runtime in the Dockerfile, so a dependency that breaks
          # on 3.12 fails here rather than in the image.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  image:
    name: scan + build + push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Expose pinned versions to the scanner
        # Trivy's pip parser only understands `name==version`. requirements.txt
        # holds ranges, so without this the fs scan finds no dependency targets
        # and passes without having checked anything.
        run: mkdir -p .trivy && cp requirements.lock .trivy/requirements.txt

      - name: Scan dependencies and config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          # Fail only on vulnerabilities that have a fix available. An
          # unfixable CVE in a base image is not something a merge can resolve,
          # so gating on it would only teach us to ignore red builds.
          ignore-unfixed: true
          exit-code: "1"

      - name: GHCR image name
        id: image
        # GHCR rejects uppercase, and this repository has some.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Loaded into the local daemon, not pushed: the scan below decides
          # whether this image is fit to publish.
          load: true
          tags: net-inventory-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: net-inventory-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@v4
        # Pull requests stop at the scan; only main publishes.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Every layer is already in the cache from the build step above.
          cache-from: type=gha
