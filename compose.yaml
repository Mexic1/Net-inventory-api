# One command from a fresh clone: `docker compose up --build`.
# Values come from .env (copy .env.example); the defaults below keep the stack
# runnable without one, except for the password, which has to be set explicitly.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      # Named volume, so the inventory survives `docker compose down`.
      # `down -v` is what actually discards it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The api waits on this, so it has to mean "accepting queries", not
      # "process started". pg_isready against the real database does.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventory}
    depends_on:
      db:
        # Without the condition, the api starts against a database that is not
        # listening yet and create_all fails on first boot.
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  adminer:
    image: adminer:5
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
